# 받아들인 의존성 위험. 항목마다 사유와 만료일을 둔다. 만료되면 로컬 검사(scripts/check.ps1)가 다시 실패한다.
# 절차: https://github.com/reddol18/docflow/issues/25 (Act — 위험 수용은 사유를 남긴다)

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2027-02-01
reason = "minimatch 10.x (패턴 증폭 DoS, 11.0.1에서 고침): eslint(frontend)와 promptfoo 0.125.0(eval/promptfoo, glob 13 경유)이 쓰는 개발용 의존성. 배포 산출물에 들어가지 않고 패턴은 우리 설정 파일 글자뿐. eslint·promptfoo 갱신 때 함께 올린다. promptfoo 쪽은 https://github.com/reddol18/docflow/issues/22 에서 받아들임. IgnoredVulns는 ID 단위로 모든 lock에 걸리므로 만료는 eslint 쪽(2027-02-01)이지만, promptfoo 경로는 아래 두 건과 함께 2026-12-07에 다시 본다."

# 아래 둘: 모델 비교 하네스(eval/promptfoo, 개발 PC에서 손으로 돌림, 배포·이미지에 없음)의 promptfoo 0.125.0 간접 의존성.
# 고친 판은 상위 패키지가 받지 않는 다음 메이저 판(5→6, 13→14)이라 overrides로 올리면 semver 계약을 깬다 → promptfoo가 올리면 갱신. https://github.com/reddol18/docflow/issues/22
# IgnoredVulns는 ID 단위로 모든 lock 파일에 걸린다 — 나중에 다른 lock(frontend·requirements)에 같은 ID가 들어와도 조용히 걸러지므로
# 만료(2026-12-07) 때 어느 lock에서 나오는지 함께 다시 본다. 위험 수용 이슈는 사용자 결정 대기.
[[IgnoredVulns]]
id = "GHSA-c475-qrg2-pj4r"
ignoreUntil = 2026-12-07
reason = "basic-ftp 5.3.1 (FTP 서버 목록 응답 정규식 DoS, 6.2.1에서 고침): proxy-agent → pac-proxy-agent → get-uri의 ftp: PAC 주소 경로에서만 쓴다. 하네스는 프록시·PAC·FTP를 쓰지 않는다."

[[IgnoredVulns]]
id = "GHSA-3g3m-2fjr-6pw4"
ignoreUntil = 2026-12-07
reason = "glob 13.0.7 (AbortSignal로 멈춘 뒤에도 폴더를 계속 읽음, 14.0.2에서 고침): promptfoo가 우리 설정의 file:// 경로를 찾을 때 쓴다. 외부에서 중단 신호·경로를 넣는 입력이 없다."
