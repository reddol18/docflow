# 받아들인 의존성 위험. 항목마다 사유와 만료일을 둔다. 만료되면 로컬 검사(scripts/check.ps1)가 다시 실패한다.
# 절차: https://github.com/reddol18/docflow/issues/25 (Act — 위험 수용은 사유를 남긴다)

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2027-02-01
reason = "minimatch 10.x (패턴 증폭 DoS, 11.0.1에서 고침): eslint(frontend)와 promptfoo 0.125.0(eval/promptfoo, glob 13 경유)이 쓰는 개발용 의존성. 배포 산출물에 들어가지 않고 패턴은 우리 설정 파일 글자뿐. eslint·promptfoo 갱신 때 함께 올린다. promptfoo 쪽은 https://github.com/reddol18/docflow/issues/22 에서 받아들임. IgnoredVulns는 ID 단위로 모든 lock에 걸리므로 만료는 eslint 쪽(2027-02-01)이지만, promptfoo 경로는 아래 glob 건과 함께 2026-12-07에 다시 본다."

# 아래: 모델 비교 하네스(eval/promptfoo, 개발 PC에서 손으로 돌림, 배포·이미지에 없음)의 promptfoo 0.125.0 간접 의존성.
# 고친 판은 상위 패키지가 받지 않는 다음 메이저 판(13→14)이라 overrides로 올리면 semver 계약을 깬다 → promptfoo가 올리면 갱신. https://github.com/reddol18/docflow/issues/22
# basic-ftp는 메이저(5→6)인데도 eval/promptfoo/package.json overrides로 올렸다(판은 그 파일 한 곳) — GHSA-c475-qrg2-pj4r 항목을 지움. https://github.com/reddol18/docflow/issues/123
# 둘을 다르게 다루는 까닭: basic-ftp는 get-uri의 ftp: 경로 한 곳에서 Client.access·lastMod·list·downloadTo·close만 쓰고 6.x에 그대로 있음을 확인했다.
# glob은 promptfoo가 직접 의존하고 여러 곳에서 부르는데, 14로 넘겼을 때 그 호출이 깨지는지는 확인하지 않았다 → 수용 유지.
# IgnoredVulns는 ID 단위로 모든 lock 파일에 걸린다 — 나중에 다른 lock(frontend·requirements)에 같은 ID가 들어와도 조용히 걸러지므로
# 만료(2026-12-07) 때 어느 lock에서 나오는지 함께 다시 본다. 위험 수용 이슈는 사용자 결정 대기.
[[IgnoredVulns]]
id = "GHSA-3g3m-2fjr-6pw4"
ignoreUntil = 2026-12-07
reason = "glob 13.0.7 (AbortSignal로 멈춘 뒤에도 폴더를 계속 읽음, 14.0.2에서 고침): promptfoo가 우리 설정의 file:// 경로를 찾을 때 쓴다. 외부에서 중단 신호·경로를 넣는 입력이 없다."

# picomatch 2.3.2·4.0.7 (extglob 반복 ReDoS, 2026-10-19 공개, 고친 판 없음 — last_affected 4.0.7). 2026-11-19 사용자 결정으로 수용.
# frontend: 두 판 모두 lock에서 "dev": true — 2.3.2는 eslint-config-next → @next/eslint-plugin-next가 고정한 fast-glob 3.3.1
#   → micromatch → picomatch ^2, 4.0.7은 tinyglobby(typescript-eslint·eslint-import-resolver-typescript) 경유.
#   frontend/Dockerfile은 standalone이 아니라 next build → npm prune --omit=dev → node_modules 복사 → next start라 이 둘은 이미지에서 빠진다.
#   2.x 줄은 fast-glob 판이 고정이라 picomatch 4.x만 고쳐져도 lock 갱신으로는 안 풀린다 → eslint-config-next 갱신이나 overrides가 필요.
# next 16.4.5 자체 사본: node_modules/next/dist/compiled/picomatch (lock에 없어 osv가 못 보고, 이미지에 들어간다). 실행 때(next start)는
#   dist/shared/lib/match-local-pattern.js·match-remote-pattern.js(next/image 패턴 매칭)에서만 부르는데 frontend/next.config.ts에
#   images.localPatterns/remotePatterns가 없어 도달 불가. 나머지 호출(dist/build/*)은 빌드 때 우리 코드의 패턴만 받는다. next를 올려야 고쳐진다.
# eval/promptfoo: 2.3.2(optional) ← anymatch·readdirp ← chokidar 3.6.0(nunjucks의 optional peer, 설치는 됨). 개발 PC에서 손으로 돌리는
#   하네스이고 배포·이미지에 없다. nunjucks 감시 기능을 promptfoo가 켜는지, 감시 패턴이 어디서 오는지는 미확인.
# IgnoredVulns는 ID 단위로 모든 lock에 걸린다 — 다른 lock에 같은 ID가 들어와도 조용히 걸러지므로 만료(2027-02-01) 때 어느 lock에서
# 나오는지 다시 본다. promptfoo 쪽은 위 glob 항목과 같은 날(2026-12-07)에 다시 본다. 고친 판이 나오면 올린다.
[[IgnoredVulns]]
id = "GHSA-fc5q-39xc-vjpf"
ignoreUntil = 2027-02-01
reason = "picomatch ReDoS(고친 판 없음): frontend npm 사본(2.3.2·4.0.7)은 dev라 npm prune으로 이미지에서 빠짐(2.x는 eslint-config-next의 fast-glob 3.3.1 고정 경로라 갱신·overrides 필요). next 내장 사본은 이미지에 있으나 next/image 패턴 매칭에서만 쓰고 images 패턴 설정이 없어 도달 불가 — next를 올려야 고쳐짐. promptfoo 사본은 nunjucks optional peer chokidar 경유 개발용(2026-12-07 재검토). https://github.com/reddol18/docflow/issues/141"

