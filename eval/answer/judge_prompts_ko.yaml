# 답변 평가 심판 지시문 (https://github.com/reddol18/docflow/issues/21). 판을 바꾸면 version을 올린다 —
# 결과 파일에 version과 이 파일 전체의 sha256이 남는다 (eval/answer/judge.py). 일치도가 기준 미달이면 이 파일만 고쳐 재채점한다.
# ko-2 (2026-11-24): ko-1 일치도 미달 두 지표(faithfulness·answer_relevancy)만 고친 판. 나머지 지표의 지시문·기준값은 ko-1과
#   글자 하나 다르지 않다 (ko-1 채점 결과를 그대로 쓴다). 고친 까닭은 각 항목 주석.
version: ko-2

# 연속 점수(Ragas 0~1) → 통과·실패. 사람 채점 기준(eval/answer/human_sheet.py RUBRIC)과 뜻을 맞춘 값
thresholds:
  # ko-2: 0.8 → 1.0. RUBRIC은 '문서에 없거나 다른 주장이 하나라도 있으면 F' — 진술 하나만 틀려도 실패여야 뜻이 같다
  faithfulness: 1.0
  # ko-2: 0.7 → 0.3. 지은 질문과 원래 질문의 코사인(text-embedding-3-small)은 다른 유형 질의끼리도 중앙값 0.42,
  # 하위 10% 0.28이다 — 0.7은 짧지만 바로 답한 답(대상이 답에 안 드러남)을 떨어뜨렸다. 0.3은 '서로 다른 질의 대부분보다도
  # 덜 닮음'(분명한 딴소리)만 거르는 바닥이다. 회피 답은 noncommittal로 0이 되어 이 값과 무관하게 실패
  answer_relevancy: 0.3
  context_precision: 0.5   # 필요한 문서가 1~2위 (필요한 문서 1건이면 평균 정밀도 = 1/순위)
  context_recall: 0.8      # 참고 답 내용 대부분이 가져온 문서에 있음 (3건 묶음이면 3건 다)
  citation_accuracy: 1.0   # 단 근거 표시가 모두 가져온 문서이고 내용을 뒷받침

# Ragas 0.4.3 metrics.collections 지시문을 한국어로 바꾼다 (출력 JSON 형식은 Ragas 그대로).
# 키: <지표>.<지시문 속성>. judge.py가 속성이 모두 있는지 확인하고 바꾼다
ragas:
  # ko-2: 한 줄 답('처리결과: 수리 [근거]')에서 질문의 전제를 따로 진술로 만들어 근거 있는 답이 0.33~0.67이 됐다 →
  # 답이 주장한 것만, 짧은 답은 진술 하나로. 여러 문서 나열은 문서마다 '조건에 맞는 문서다'까지 진술로 (사람은 그것도 봄)
  faithfulness.statement_generator_prompt: |-
    질문과 답이 주어진다. 답에 적힌 사실 주장만 진술로 나눈다. 진술마다 혼자 읽어도 뜻이 통하게, 대명사('이것', '그 문서' 등)
    대신 가리키는 대상을 그대로 적는다.
    - 답이 '항목: 값' 한 줄처럼 짧으면 질문에서 대상(문서번호·신청 종류·회사 등)을 가져와 '<대상>의 <항목>은 <값>이다' 진술 하나로 만든다.
      질문에만 있고 답이 주장하지 않은 내용은 따로 진술로 만들지 않는다.
    - 답이 여러 문서를 나열하면 문서마다 진술을 만든다. 문서는 근거 표시([철/문서])로 가리키고, 그 문서가 질문의 조건(회사·신청 종류·
      연도 등)에 맞는 문서라는 주장도 진술로 둔다.
    - '○건이다'처럼 개수를 밝힌 주장은 진술 하나로 그대로 둔다.
    - 그 밖에는 근거 표시를 진술에 넣지 않는다. 답의 형식·인용 방식에 대한 진술(예: '답은 근거를 달았다')은 만들지 않는다.
    진술은 한국어로 쓴다.
  # ko-2: 서식 칸 이름('접수 처리과')을 부서 값으로 인정, 검색 결과 일부만 보고 '1건이다'를 인정한 것 → 값이 그 항목의 값인지,
  # 다른 문서 값으로 맞추지 않는지, 개수 주장은 문맥이 전부임을 보여야 1
  faithfulness.nli_statement_prompt: |-
    주어진 문맥(공문서 검색 결과 몇 건)만 보고 각 진술이 사실인지 판단한다. 진술 전체를 문맥에서 바로 끌어낼 수 있으면 verdict 1,
    일부라도 문맥에 없거나 문맥과 다르면 verdict 0을 준다. 일반 상식으로 보충하지 않는다.
    - 글자가 문맥 어딘가에 있다는 것만으로 1을 주지 않는다. 진술의 값이 문맥에서 바로 그 항목의 값인지 본다. 서식의 칸 이름
      (접수·처리과·참조·담당자·선결·경유 등)은 값이 아니다. 문서를 낸 부서는 문서번호 앞 부서 이름이나 '○○과-번호' 표시로 본다.
    - 근거 표시나 문서번호로 문서를 가리킨 진술은 그 문서의 글로만 판단한다. 다른 문서의 값으로 맞추지 않는다.
    - '○건이다' 같은 개수 주장은, 문맥이 검색 결과 일부일 수 있으므로 문맥이 그것이 전부라고 밝히지 않는 한 verdict 0이다.
    OCR로 읽은 글이라 띄어쓰기·기호·날짜 표기(1998-01-14와 98. 1. 14.)가 조금 달라도 같은 값이면 같은 것으로 본다.
    reason은 한국어로 짧게 쓴다.
  # ko-2: 짧은 답에서 대상 없는 질문('처리결과는 무엇인가?')을 지어 코사인이 낮았고, '보완 요구'를 회피로 보아 0이 됐다 →
  # 답에 나온 항목·대상을 질문에 넣고, noncommittal은 값 없이 피한 답만
  answer_relevancy.prompt: |-
    주어진 답을 보고, 그 답이 대답하고 있을 질문을 한국어로 하나 지어라. 답이 짧아도 답에 나온 항목 이름(처리결과·신청인·시행일자·
    위치·부서·수신 등)과 대상(문서번호·회사·대표자·신청 종류·날짜 등)을 질문에 넣어, 공문서 검색 도우미에게 할 법한 구체적인 질문으로
    짓는다. 답에 없는 내용은 지어내지 않고, 근거 표시([철/문서])는 질문에 넣지 않는다.
    그리고 답이 얼버무리는 답인지 판단한다. 값 없이 답을 피한 답('모른다', '목록에 없다', '해당 문서가 없다', '확인할 수 없다',
    '경우에 따라 다르다')만 noncommittal 1이다. 질문 항목의 값(처리결과 '수리'·'허가'·'보완 요구'·'반려'·'불허', 이름, 날짜,
    부서, 주소 등)을 하나라도 답했으면, 한 줄짜리 짧은 답이거나 값의 뜻이 부정적이어도 noncommittal 0을 준다.
  context_precision.prompt: |-
    질문, 답(참고 답), 문맥(검색으로 가져온 공문서 한 건)이 주어진다. 이 문맥이 그 답에 이르는 데 쓸모 있었는지 판단한다.
    쓸모 있었으면 verdict 1, 아니면 verdict 0을 JSON으로 준다. reason은 한국어로 짧게 쓴다.
  context_recall.prompt: |-
    문맥(검색으로 가져온 공문서들)과 답(참고 답)이 주어진다. 답을 진술 단위로 나누어, 각 진술이 문맥에서 나온 것으로 볼 수 있는지 분류한다.
    문맥에서 확인되면 1, 확인되지 않으면 0 — 두 값만 쓴다. OCR로 읽은 글이라 띄어쓰기·날짜 표기(1998-01-14와 98. 1. 14.)가
    달라도 같은 값이면 확인된 것으로 본다. 분류마다 이유를 한국어로 적는다.

# ko-2: Ragas 영어 예시(아인슈타인 등)를 한국어 공문서 예시로 바꾼다 — 짧은 '항목: 값' 답·여러 문서 나열·개수 주장·서식 칸 이름.
# 고친 두 지표만. 예시의 회사·문서·키는 모두 지어낸 값이다 (실제·채점 데이터 아님). 키는 ragas와 같고, 입력·출력 필드는 Ragas 모델 그대로
ragas_examples:
  faithfulness.statement_generator_prompt:
    - input:
        question: 문서번호 총무 10000-1 문서에서 건축허가 신청의 처리결과는 무엇인가?
        answer: "처리결과: 반려 [SYNTH9999-1990-0001/SYNTH9999-1990-0001-0001]"
      output:
        statements:
          - 문서번호 총무 10000-1 문서의 건축허가 신청 처리결과는 반려이다.
    - input:
        question: 주식회사 예시물산의 도로점용허가 신청을 처리한 문서를 모두 찾아 각각의 시행일자를 알려 줘.
        answer: |-
          주식회사 예시물산의 도로점용허가 신청을 처리한 문서는 다음과 같습니다:
          1. [SYNTH9999-1990-0001/SYNTH9999-1990-0001-0002] 시행일자: 1990-01-02
          2. [SYNTH9999-1991-0001/SYNTH9999-1991-0001-0003] 시행일자: 1991-03-04
      output:
        statements:
          - "[SYNTH9999-1990-0001/SYNTH9999-1990-0001-0002] 문서는 주식회사 예시물산의 도로점용허가 신청을 처리한 문서이다."
          - "[SYNTH9999-1990-0001/SYNTH9999-1990-0001-0002] 문서의 시행일자는 1990-01-02이다."
          - "[SYNTH9999-1991-0001/SYNTH9999-1991-0001-0003] 문서는 주식회사 예시물산의 도로점용허가 신청을 처리한 문서이다."
          - "[SYNTH9999-1991-0001/SYNTH9999-1991-0001-0003] 문서의 시행일자는 1991-03-04이다."
    - input:
        question: 예시시가 1990년에 시행한 도로점용허가 관련 문서는 몇 건이고, 각각 신청인은 누구인가?
        answer: 1990년에 시행한 도로점용허가 관련 문서는 1건입니다. 신청인은 주식회사 예시물산(대표 홍길동)입니다. [SYNTH9999-1990-0001/SYNTH9999-1990-0001-0002]
      output:
        statements:
          - 예시시가 1990년에 시행한 도로점용허가 관련 문서는 1건이다.
          - 예시시가 1990년에 시행한 도로점용허가 관련 문서의 신청인은 주식회사 예시물산(대표 홍길동)이다.
  faithfulness.nli_statement_prompt:
    - input:
        context: |-
          [SYNTH9999-1990-0001/SYNTH9999-1990-0001-0002] 문서번호 건축 10000-2 / 시행일자 1990-01-02 / 수신 주식회사 예시물산 대표 홍길동 / 제목 도로점용허가 신청에 대한 회신
          본문 앞부분: 예 시 시 문서번호 건축10000-2 시행일자 90. 1. 2. (보존:3년) 수 신 주식회사 예시물산 대표 홍길동 접수 처리과 참조 담당자 제 목 도로점용허가 신청에 대한 회신 1.귀사에서 제출한 도로점용허가 신청에 대하여 검토한 결과를 알려 드립니다. 2.처리 내용 가.신청인: 주식회사 예시물산(대표 홍길동) 나.위 치: 예시시 중앙로 1 다.처리결과: 수리 끝. 건축과-2(1990.1.2.)
        statements:
          - "[SYNTH9999-1990-0001/SYNTH9999-1990-0001-0002] 문서의 시행일자는 1990-01-02이다."
          - "[SYNTH9999-1990-0001/SYNTH9999-1990-0001-0002] 문서는 접수 처리과에서 냈다."
          - "[SYNTH9999-1990-0001/SYNTH9999-1990-0001-0002] 문서는 주식회사 예시물산의 옥외광고물 표시허가 신청을 처리한 문서이다."
          - 예시시가 1990년에 시행한 도로점용허가 관련 문서는 1건이다.
      output:
        statements:
          - statement: "[SYNTH9999-1990-0001/SYNTH9999-1990-0001-0002] 문서의 시행일자는 1990-01-02이다."
            reason: 시행일자 90. 1. 2.와 같은 날짜다.
            verdict: 1
          - statement: "[SYNTH9999-1990-0001/SYNTH9999-1990-0001-0002] 문서는 접수 처리과에서 냈다."
            reason: 접수·처리과는 서식 칸 이름이다. 문서를 낸 부서는 건축과(건축과-2)다.
            verdict: 0
          - statement: "[SYNTH9999-1990-0001/SYNTH9999-1990-0001-0002] 문서는 주식회사 예시물산의 옥외광고물 표시허가 신청을 처리한 문서이다."
            reason: 이 문서의 제목은 도로점용허가 신청에 대한 회신이다.
            verdict: 0
          - statement: 예시시가 1990년에 시행한 도로점용허가 관련 문서는 1건이다.
            reason: 문맥은 검색 결과 일부라 그것이 전부인지 알 수 없다.
            verdict: 0
  answer_relevancy.prompt:
    - input:
        response: "처리결과: 보완 요구 [SYNTH9999-1990-0001/SYNTH9999-1990-0001-0001]"
      output:
        question: 그 신청의 처리결과는 무엇인가?
        noncommittal: 0
    - input:
        response: 문서번호 총무 10000-1 문서의 신청인은 주식회사 예시물산(대표 홍길동)입니다. [SYNTH9999-1990-0001/SYNTH9999-1990-0001-0001]
      output:
        question: 문서번호 총무 10000-1 문서의 신청인 회사와 대표자는 누구인가?
        noncommittal: 0
    - input:
        response: 문서번호 건축 10000-2 / 시행일자 1990-01-02 / 수신 주식회사 예시물산 대표 홍길동 / 제목 도로점용허가 신청에 대한 회신
      output:
        question: 주식회사 예시물산(대표 홍길동)의 도로점용허가 신청에 회신한 문서는 언제 시행되었나?
        noncommittal: 0
    - input:
        response: 제공된 문서 목록에는 주식회사 예시물산의 문서가 없어 답할 수 없습니다.
      output:
        question: 주식회사 예시물산의 신청을 처리한 문서는 무엇인가?
        noncommittal: 1

# 직접 만든 지표 (Ragas에 없음)
custom:
  refusal: |-
    공문서 검색 도우미의 답이 주어진다. 이 답이 '자료에 없어 답할 수 없다'는 뜻(모른다·목록에 없다·해당 문서가 없다·확인할 수 없다)으로
    답을 피했는지 판단한다. 질문에 대한 구체적인 값(날짜·이름·부서·처리결과 등)을 하나라도 답했으면 refused 0,
    구체적인 값 없이 자료가 없다고만 했으면 refused 1을 준다. reason은 한국어로 짧게 쓴다.
  citation_support: |-
    공문서 검색 도우미의 답과, 그 답이 근거로 단 문서 한 건의 글이 주어진다. 답에서 이 문서를 근거로 단 내용(같은 문장이나
    바로 앞 내용)이 이 문서 글로 뒷받침되는지 판단한다. 뒷받침되면 supported 1, 문서에 없거나 다르면 supported 0을 준다.
    OCR로 읽은 글이라 띄어쓰기·날짜 표기가 달라도 같은 값이면 뒷받침된 것으로 본다. reason은 한국어로 짧게 쓴다.
