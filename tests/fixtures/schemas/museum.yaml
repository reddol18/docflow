# 시험용 두 번째 고객 스키마 — 박물관 아카이브식 자료 등록. 이름·값은 모두 지어낸 것
# (https://github.com/reddol18/docflow/issues/72#issuecomment-6729785050). 김해 칸 이름(docno·serial·date·recipient·title)을 쓰지 않는다.
# 시험(tests/test_schema_customers.py)이 기본 스키마 isad_g.yaml과 같은 임시 폴더에 복사해 FIELD_SCHEMA로 준다.
name: 가상 박물관 아카이브 (시험)
base: isad_g.yaml
extract:
  preamble: 입력은 가상 박물관 소장 자료 한 건의 첫 쪽을 OCR로 줄 단위로 옮긴 텍스트다.
  rules: 칸마다 confidence(0~1)를 붙인다. 텍스트에 없는 것을 지어내지 않는다.
fields:
  - {name: material_name, label: 자료명, level: document, method: llm_extract, isad: title, prompt: 자료명}
  - {name: reg_no, label: 등록번호, level: document, method: manual, isad: reference_code, note: 승인 때 부여}
  - {name: producer, label: 생산자, level: document, method: llm_extract, isad: creator, prompt: 생산자 (기관·사람)}
  - name: produced_on
    label: 생산일자
    level: document
    method: llm_extract
    isad: dates
    prompt: 생산일자를 YYYY-MM-DD로. 모르면 "미상"
    normalize: [strip, date_unknown, decade]
  - {name: keywords, label: 키워드, level: document, method: llm_generate, isad: scope_content, prompt: 내용 키워드 3~5개를 쉼표로}
  - name: material_type
    label: 유형
    level: document
    method: vocab
    isad: scope_content
    prompt: 자료 유형
    vocab: [문서, 사진, 도면, 지도, 기타]
  - {name: page_count, label: 쪽수, level: document, method: rule, rule: pages, isad: extent}
  - {name: holder, label: 소장처, level: volume, method: fixed, value: 가상 박물관, isad: copyright}
search:
  keyword: [material_name, producer, keywords]
  embed: [material_name, producer, produced_on, keywords]
  year: produced_on
  columns: [produced_on, reg_no, material_name, producer, material_type]
