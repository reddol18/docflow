  # ---------- API Security Top 10 ----------
  - {id: API1, text: "객체 수준 권한", status: 해당없음, evidence: "V4.2.1과 같음 (역할 확인 app/auth.py:281-297)"}
  - {id: API2, text: "인증 깨짐", status: 일부, evidence: "기본 구조 튼튼(app/auth.py login_local·verify_id_token). 로그인 성공·실패(사유 분류)·로그아웃·잠금과 처리 함수 앞 401·403·422를 감사 로그에 — 실패 응답은 감사 쓰기·까닭 분류를 기다리지 않아 없는 계정·잠김·꺼짐·상한 찬 때 사이에 DB 왕복이 같음(있는 계정의 틀린 비밀번호는 이전부터 시도 횟수 쓰기만큼 다르고 계정별 시도 제한이 묶음)(app/auth.py audit_later, tests/test_auth_pg.py test_failed_login_time_independent_of_account, https://github.com/reddol18/docflow/issues/63). V2.2.1·V3.4.1·V4.3.1 남음"}
  - {id: API3, text: "객체 속성 수준 권한 (과다 노출·대량 할당)", status: 일부, evidence: "수정은 EDITABLE만(app/main.py _edit_document). events의 예외 원문 노출은 해소(https://github.com/reddol18/docflow/issues/28). 남음: /documents는 상태 전체"}
  - {id: API4, text: "자원 소모 무제한", status: 일부, evidence: "로그인 제한·LLM 예산, q·k·폼 칸 상한(https://github.com/reddol18/docflow/issues/49). 업로드 크기·개수 무제한 https://github.com/reddol18/docflow/issues/26 , /search·/ask 호출 제한 없음 https://github.com/reddol18/docflow/issues/7"}
  - {id: API5, text: "기능 수준 권한", status: 충족, evidence: "app/auth.py:281-297 require(role), tests/test_auth.py 경로 순회(ADMIN_ROUTES에 /export.xlsx·DELETE /volumes/{vol}, https://github.com/reddol18/docflow/pull/67)"}
  - {id: API6, text: "민감한 업무 흐름 남용", status: 미충족, evidence: "/ask·/search 사용자별 제한 없음, 색인과 전역 예산 공유(store.py:101-104) https://github.com/reddol18/docflow/issues/7"}
  - {id: API7, text: "SSRF", status: 일부, evidence: "issuer는 설정값, jwks_uri·token_endpoint·authorization_endpoint는 discovery 문서에서 오되 scheme·호스트·포트가 issuer와 같아야(app/auth.py check_discovery, tests/test_auth.py test_check_discovery_hosts·tests/test_auth_pg.py test_oidc_discovery_host_must_match_issuer), docflow-egress 443 except에 169.254/16·127/8·100.64/10 추가(k8s/docs.yaml) https://github.com/reddol18/docflow/issues/48. LLM 주소 LLM_BASE_URL은 사용자 입력이 아닌 설치 설정이고, local은 루프백·사설 IP(10/8, 172.16/12, 192.168/16)·클러스터 내부 이름만(169.254·0.0.0.0·공인 주소 거부, app/llm.py:88-112, https://github.com/reddol18/docflow/issues/13)"}
  - {id: API8, text: "보안 설정 오류", status: 일부, evidence: "보안 헤더·캐시 금지는 해소(https://github.com/reddol18/docflow/issues/47). k8s 컨테이너 최소 권한도 해소: root 아님·읽기 전용 루트·capability 전부 버림·seccomp RuntimeDefault·SA 토큰 없음, trivy config(HIGH 이상) 0건을 막는 검사로·semgrep에 k8s 포함(https://github.com/reddol18/docflow/issues/29). COOKIE_SECURE=0·http는 해소(https://github.com/reddol18/docflow/issues/48). 남음: 맥 k3s 실행 확인(https://github.com/reddol18/docflow/issues/29 완료 조건 3, 배포 뒤). 평가 하네스(개발 PC)의 기본 설정 위험은 막음: promptfoo view 모든 인터페이스·cors 모두 허용·Host 확인 없음 → localhost_only.cjs(127.0.0.1 묶기, 다른 Host·Origin 403, ACAO 지움), Machine 환경변수 OLLAMA_HOST=0.0.0.0 → run.ps1이 켜는 Ollama는 127.0.0.1 (https://github.com/reddol18/docflow/issues/22)"}
  - {id: API9, text: "API 목록 관리", status: 충족, evidence: "app/main.py 머리말 목록 22개(GET /schema 추가) = 실제 라우트, tests/test_input.py test_header_api_list_matches_routes가 app.routes와 양방향 비교 (https://github.com/reddol18/docflow/issues/49)"}
  - {id: API10, text: "외부 API 응답을 믿음", status: 일부, evidence: "OIDC 서명·aud·nonce 확인, 출력 이스케이프. OpenAI 추출은 스키마 칸만 받고 dict·칸 모양이 다르면 빈 값·확신도 0(app/fields.py:274-289 parse_extract, app/llm.py:210·평가 하네스 eval/promptfoo/gate.py가 같이 씀, https://github.com/reddol18/docflow/issues/9), JSON 자체가 깨지면 예외로 철 실행이 멈춤. 비전·답변 응답은 그대로 https://github.com/reddol18/docflow/issues/27"}

