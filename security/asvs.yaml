  # ---------- V9 통신 ----------
  - {id: V9.1.1, level: 1, text: "모든 통신 TLS", status: 일부, evidence: "https://github.com/reddol18/docflow/issues/48: 브라우저↔web 파드 https(frontend/tls-proxy.mjs, 내부 CA scripts/ca.ps1, TLS 1.2+), PG hostssl만 + docflow sslmode=verify-full(k8s/docs.yaml pg-hba·PG_URL), Qdrant TLS + API 키(QDRANT_URL https, QDRANT_CA_FILE). 남음: web(Next)↔docflow:8000은 클러스터 안 http(NetworkPolicy docflow-from-web로 web 파드만), 이 PC 개발 서버는 http(localhost). 데모는 ssh 터널. LLM: openai는 api.openai.com https, LLM_PROVIDER=local은 LLM_BASE_URL이 http/https + 루프백·사설 IP·클러스터 내부 이름일 때만 시작(app/llm.py:88-112 internal_host·check_local_url, tests/test_llm_provider.py) — 내부 서버라도 http면 평문(현장 설정 몫, https://github.com/reddol18/docflow/issues/13). 평가 하네스(eval/promptfoo/, 개발 PC)는 api.openai.com https. 로컬 모델: run.ps1 -Local이 켜는 Ollama는 OLLAMA_HOST=127.0.0.1:11434로 켜고(이 PC Machine 환경변수 0.0.0.0:11434를 덮음) 켠 뒤 듣는 주소를 확인해 127.0.0.1 밖이면 멈춤 — LAN 주소로는 접속 거부 확인. 미리 켜 둔 Ollama는 건드리지 않고 모든 인터페이스면 경고만(평문 http, 그 설정은 사용자 몫). 비교 화면(-View)은 127.0.0.1:15500에만 묶고 Host·Origin이 127.0.0.1/localhost:15500이 아니면 403, Access-Control-Allow-Origin 지움(localhost_only.cjs — promptfoo 기본은 모든 인터페이스·cors 모두 허용). promptfoo 공유·원격 생성·사용 통계 끔(run.ps1 PROMPTFOO_DISABLE_*, --no-share) — 단 'telemetry disabled' 이벤트 한 번은 r.promptfoo.app(https)으로 감(문서 글자 없음)"}

