  - {id: V2.1.7, level: 1, text: "유출·흔한 비밀번호를 거른다", status: 미충족, evidence: "app/users.py:33 길이만. https://github.com/reddol18/docflow/issues/40 (risk-accepted)"}
  - {id: V2.2.1, level: 1, text: "자동 대입 방지 (잠금·속도 제한)", status: 일부, evidence: "app/auth.py:132-137 원자적 시도·잠금, :172-194 이름별 창. IP 창은 TRUST_PROXY 없어 꺼짐 https://github.com/reddol18/docflow/issues/40"}
  - {id: V2.4.1, level: 2, text: "비밀번호는 승인된 느린 해시로 저장", status: 충족, evidence: "app/auth.py:107 argon2id, :149-150 다시 해시"}

