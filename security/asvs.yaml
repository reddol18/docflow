  - {id: V3.2.2, level: 1, text: "세션 토큰 64비트 이상 무작위", status: 충족, evidence: "app/auth.py:204 token_urlsafe(32), DB에는 SHA-256만"}
  - {id: V3.3.1, level: 1, text: "로그아웃하면 서버에서 세션 폐기", status: 충족, evidence: "app/auth.py:512-521 → drop_session(:222-224)"}
  - {id: V3.3.2, level: 2, text: "절대 만료 (L2: 12시간)", status: 충족, evidence: "app/auth.py:208,215 expires_at 고정, k8s/docs.yaml SESSION_HOURS=12"}
  - {id: V3.4.1, level: 1, text: "쿠키 Secure", status: 일부, evidence: "app/auth.py:59,233 기본 Secure, 데모(http)는 COOKIE_SECURE=0. https://github.com/reddol18/docflow/issues/48"}
  - {id: V3.4.2, level: 1, text: "쿠키 HttpOnly", status: 충족, evidence: "app/auth.py:233,547"}
  - {id: V3.4.3, level: 1, text: "쿠키 SameSite", status: 충족, evidence: "app/auth.py:233,547 lax"}
  - {id: V3.4.4, level: 1, text: "__Host- 쿠키 접두어", status: 미충족, evidence: "app/auth.py:56-57 접두어 없음. https 전환 때 https://github.com/reddol18/docflow/issues/48"}

