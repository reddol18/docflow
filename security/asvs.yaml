  - {id: LLM07, text: "시스템 프롬프트 노출", status: 충족, evidence: "app/field_schemas/*.yaml(추출 지시문)·app/llm.py:257-258 프롬프트에 비밀·권한 규칙 없음, GET /schema(app/main.py:775-782)는 지시문·고정값을 내보내지 않음(tests/test_fields.py test_schema_endpoint), 키는 따로(:151-153, local 키 파일 :159-164)"}
