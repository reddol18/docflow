# docflow 보안 체크리스트 (https://github.com/reddol18/docflow/issues/25)
#
# 쓰는 법
# - 이슈의 "보안 영향" 칸 → 아래 boxes가 가리키는 항목만 그 PR의 점검 대상이다.
# - security-reviewer가 항목별로 판정한다: 충족 / 일부 / 미충족 / 해당없음 / 미판정
# - status는 "지금 main의 상태". 기준선 점검(코드 전체 1회)과 PR 점검 결과로 갱신하고, 근거(파일 또는 PR)를 단다.
# - 남기고 병합한 미충족은 risk-accepted 라벨 이슈로 (주간 지표가 센다).
# - 기준선 점검: 2026-11-04, main 49a7d87, security-reviewer 3개 영역 (입력·파일·API / 인증·데이터·설정 / LLM·검색·비용).
#   결과 https://github.com/reddol18/docflow/issues/25 댓글. 근거의 파일:줄은 그 커밋 기준이라 코드가 바뀌면 어긋난다 —
#   항목을 다시 판정할 때(그 칸을 고른 PR의 security-reviewer) 근거도 새로 적는다.
#
# 기준: OWASP ASVS 4.0.3 (L1 + docflow에 필요한 L2 일부), API Security Top 10 2023, LLM Top 10 2025.
# 항목 문구는 요약이다. 정확한 문장은 원문을 볼 것.

version: 1
sources:
  asvs: "OWASP ASVS 4.0.3"
  api: "OWASP API Security Top 10 2023"
  llm: "OWASP Top 10 for LLM Applications 2025"

# 이슈 템플릿(.github/ISSUE_TEMPLATE/feature.yml)의 "보안 영향" 칸 → 점검할 항목
boxes:
