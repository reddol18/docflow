  인증·세션 변경: [V2.1.1, V2.1.5, V2.1.7, V2.2.1, V2.4.1, V4.2.2, V3.2.1, V3.2.2, V3.3.1, V3.3.2, V3.4.1, V3.4.2, V3.4.3, V3.4.4, V7.1.1, API2]
  권한·역할 변경: [V4.1.1, V4.1.3, V4.1.5, V4.2.1, V4.3.1, API1, API3, API5]
