  - {id: LLM10, text: "무제한 소비 (비용)", status: 일부, evidence: "app/llm.py:177-182 사후 정산(openai 제공자만), :188 모르는 모델 0원, 출력 상한 extract 512·answer 1024·read_cell 40(:49-52, :204, :235, :271) https://github.com/reddol18/docflow/issues/7. LLM_PROVIDER=local은 한도를 보지 않고 사용량을 0원으로 남김 — 내부 주소(루프백·사설 IP·클러스터 내부 이름)만 받아(:88-131) 바깥 유료 API로 새지 않을 때만 면제, 로컬 서버 자원(GPU 시간) 한도는 없음 https://github.com/reddol18/docflow/issues/13. 평가 하네스(eval/promptfoo/run.ps1)는 운영 예산 밖에서 개발 PC가 손으로 돌린다 — 전체 행렬 1800회 약 $0.66, 건당 비용을 결과 표에 기록(gate.py cost_latency, 로컬 모델·replay만 0원). 응답마다 max_tokens 512(promptfooconfig.yaml, 정상 응답 최대 310토큰), 단가 모르는 원격 모델은 0원으로 치지 않고 종료 코드 2(gate.py price_of·unpriced, tests/test_model_harness.py test_price_of). 실행 전 총액 상한은 없음 — 월 한도를 건 하네스 전용 OpenAI 프로젝트 키 권장(README, 있는지는 확인 못 함) (https://github.com/reddol18/docflow/issues/22)"}
