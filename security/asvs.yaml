# docflow 보안 체크리스트 (https://github.com/reddol18/docflow/issues/25)
#
# 쓰는 법
# - 이슈의 "보안 영향" 칸 → 아래 boxes가 가리키는 항목만 그 PR의 점검 대상이다.
# - security-reviewer가 항목별로 판정한다: 충족 / 일부 / 미충족 / 해당없음 / 미판정
# - status는 "지금 main의 상태". 기준선 점검(코드 전체 1회)과 PR 점검 결과로 갱신하고, 근거(파일 또는 PR)를 단다.
# - 남기고 병합한 미충족은 risk-accepted 라벨 이슈로 (주간 지표가 센다).
#
# 기준: OWASP ASVS 4.0.3 (L1 + docflow에 필요한 L2 일부), API Security Top 10 2023, LLM Top 10 2025.
# 항목 문구는 요약이다. 정확한 문장은 원문을 볼 것.

version: 1
sources:
  asvs: "OWASP ASVS 4.0.3"
  api: "OWASP API Security Top 10 2023"
  llm: "OWASP Top 10 for LLM Applications 2025"

# 이슈 템플릿(.github/ISSUE_TEMPLATE/feature.yml)의 "보안 영향" 칸 → 점검할 항목
boxes:
  새 입력·폼·쿼리 파라미터: [V5.1.3, V5.1.5, V5.3.3, V5.3.4, V13.2.1, API3, API4]
  파일 업로드·다운로드: [V12.1.1, V12.3.1, V12.5.1, V8.2.1, API4]
  새 엔드포인트: [V4.1.1, V4.1.5, V4.2.1, V4.2.2, V13.1.3, V13.2.1, V13.2.3, API1, API5, API9]
  인증·세션 변경: [V2.1.1, V2.1.5, V2.1.7, V2.2.1, V2.4.1, V4.2.2, V3.2.1, V3.2.2, V3.3.1, V3.3.2, V3.4.1, V3.4.2, V3.4.3, V3.4.4, V7.1.1, API2]
  권한·역할 변경: [V4.1.1, V4.1.3, V4.1.5, V4.2.1, V4.3.1, API1, API3, API5]
  LLM 호출 추가·변경: [LLM01, LLM02, LLM05, LLM06, LLM07, LLM10]
  검색·RAG·임베딩: [LLM01, LLM02, LLM08, V5.3.4]
  외부 통신·새 외부 서비스: [V9.1.1, V14.5.3, API7, API10]
  개인정보·민감 데이터 저장·표시: [V8.2.1, V8.3.1, V7.1.1, API3, LLM02]
  새 의존성·이미지·배포 설정: [V14.2.1, V14.3.2, V14.4.1, V14.4.3, V14.4.4, V14.4.7, API8]
  로그·오류 처리: [V7.1.1, V7.4.1, API8]
  비용·한도가 걸린 흐름: [API4, API6, LLM10]

items:
  # ---------- V2 인증 ----------
  - {id: V2.1.1, level: 1, text: "비밀번호 12자 이상", status: 충족, evidence: "app/users.py MIN_LEN=12 (PR #38)"}
  - {id: V2.1.5, level: 1, text: "사용자가 직접 비밀번호를 바꿀 수 있다", status: 미충족, evidence: "명령줄로만 (#40, risk-accepted)"}
  - {id: V2.1.7, level: 1, text: "유출·흔한 비밀번호를 거른다", status: 미충족, evidence: "#40, risk-accepted"}
  - {id: V2.2.1, level: 1, text: "자동 대입 방지 (잠금·속도 제한)", status: 일부, evidence: "app/auth.py login_local 원자적 시도(attempt_at)·계정 이름별 rate_limit (PR #38, #42). 이름을 바꿔 가며 뿌리기는 #40"}
  - {id: V2.4.1, level: 2, text: "비밀번호는 승인된 느린 해시로 저장", status: 충족, evidence: "argon2id (PR #38)"}

  # ---------- V3 세션 ----------
  - {id: V3.2.1, level: 1, text: "인증할 때 새 세션 토큰", status: 충족, evidence: "new_session, 이전 세션 삭제 (PR #38)"}
  - {id: V3.2.2, level: 1, text: "세션 토큰 64비트 이상 무작위", status: 충족, evidence: "token_urlsafe(32)"}
  - {id: V3.3.1, level: 1, text: "로그아웃하면 서버에서 세션 폐기", status: 충족, evidence: "drop_session, 시험 test_local_login_session_logout"}
  - {id: V3.3.2, level: 2, text: "절대 만료 (L2: 12시간)", status: 충족, evidence: "SESSION_HOURS=12"}
  - {id: V3.4.1, level: 1, text: "쿠키 Secure", status: 일부, evidence: "코드 기본 Secure, 데모(http)는 COOKIE_SECURE=0"}
  - {id: V3.4.2, level: 1, text: "쿠키 HttpOnly", status: 충족, evidence: "set_session_cookie"}
  - {id: V3.4.3, level: 1, text: "쿠키 SameSite", status: 충족, evidence: "Lax"}
  - {id: V3.4.4, level: 1, text: "__Host- 쿠키 접두어", status: 미충족, evidence: "#40, https 전환 때"}

  # ---------- V4 접근 제어 ----------
  - {id: V4.1.1, level: 1, text: "권한은 서버에서 강제", status: 충족, evidence: "auth.guard + require(role), 시험 test_every_route_*"}
  - {id: V4.1.3, level: 1, text: "최소 권한", status: 충족, evidence: "viewer/reviewer/admin, OIDC 기본 거절"}
  - {id: V4.1.5, level: 1, text: "실패하면 막힌다 (기본 거부)", status: 충족, evidence: "앱 전체 의존성"}
  - {id: V4.2.1, level: 1, text: "다른 사람 객체 접근 방지 (IDOR)", status: 해당없음, evidence: "철·문서 소유권이 없는 설계. 기관 분리가 필요하면 새 이슈"}
  - {id: V4.2.2, level: 1, text: "CSRF 방지", status: 충족, evidence: "X-Docflow-CSRF 또는 Sec-Fetch-Site"}
  - {id: V4.3.1, level: 1, text: "관리 기능 다중 인증", status: 미충족, evidence: "local은 비밀번호만. #40, risk-accepted (PR #42 보안 리뷰)"}

  # ---------- V5 입력 검증·출력 인코딩 ----------
  - {id: V5.1.3, level: 1, text: "입력은 허용 목록·형식으로 검증", status: 미판정, evidence: ""}
  - {id: V5.1.5, level: 1, text: "리다이렉트 주소는 허용 목록", status: 충족, evidence: "auth.safe_next"}
  - {id: V5.3.3, level: 1, text: "HTML 출력 이스케이프 (XSS)", status: 일부, evidence: "review_page가 vol·doc_id를 속성에 이스케이프 없이 넣는다. 둘 다 [\\w.-] 허용 목록(VOL_RX, 파일 이름 규칙)을 거쳐 지금은 악용 불가. 고칠 때 html.escape (#40)"}
  - {id: V5.3.4, level: 1, text: "SQL은 매개변수로", status: 미판정, evidence: ""}

  # ---------- V7 오류·로그 ----------
  - {id: V7.1.1, level: 2, text: "로그에 비밀번호·세션 토큰 없음", status: 일부, evidence: "앱은 남기지 않음. 접근 로그에 OIDC code·state (#40)"}
  - {id: V7.4.1, level: 1, text: "사용자에게는 일반 오류 문구", status: 미판정, evidence: "https://github.com/reddol18/docflow/issues/28"}

  # ---------- V8 데이터 보호 ----------
  - {id: V8.2.1, level: 1, text: "민감 응답은 캐시 금지 헤더", status: 미판정, evidence: ""}
  - {id: V8.3.1, level: 1, text: "민감 데이터는 URL이 아닌 본문으로", status: 미판정, evidence: ""}

  # ---------- V9 통신 ----------
  - {id: V9.1.1, level: 1, text: "모든 통신 TLS", status: 미충족, evidence: "데모는 http + ssh 터널. https 전환 때"}

  # ---------- V12 파일 ----------
  - {id: V12.1.1, level: 1, text: "업로드 크기·개수 상한", status: 미충족, evidence: "https://github.com/reddol18/docflow/issues/26"}
  - {id: V12.3.1, level: 1, text: "파일 이름으로 경로 이탈 방지", status: 미판정, evidence: ""}
  - {id: V12.5.1, level: 1, text: "정해진 형식만 내려보냄", status: 미판정, evidence: ""}

  # ---------- V13 API ----------
  - {id: V13.1.3, level: 1, text: "API 주소에 민감 정보 없음", status: 미판정, evidence: ""}
  - {id: V13.2.1, level: 1, text: "허용한 HTTP 메서드만", status: 미판정, evidence: ""}
  - {id: V13.2.3, level: 1, text: "쿠키 쓰는 API의 CSRF", status: 충족, evidence: "V4.2.2와 같음"}

  # ---------- V14 설정 ----------
  - {id: V14.2.1, level: 1, text: "의존성 최신·취약점 없음", status: 일부, evidence: "파이썬·npm은 osv-scanner (check.ps1). 이미지는 scripts/mac/scan_image.sh (2026-11-04): OS HIGH 56·CRITICAL 4, 파이썬 HIGH 2. 고칠 판 있는 것 #44, 나머지는 Debian 고친 판 없음"}
  - {id: V14.3.2, level: 1, text: "디버그·문서 화면 끔", status: 충족, evidence: "API_DOCS 기본 끔 (PR #38)"}
  - {id: V14.4.1, level: 1, text: "Content-Type과 문자셋", status: 미판정, evidence: ""}
  - {id: V14.4.3, level: 1, text: "CSP", status: 미판정, evidence: ""}
  - {id: V14.4.4, level: 1, text: "X-Content-Type-Options: nosniff", status: 미판정, evidence: ""}
  - {id: V14.4.7, level: 1, text: "다른 사이트에 끼워 넣기 금지 (frame-ancestors)", status: 미판정, evidence: ""}
  - {id: V14.5.3, level: 1, text: "CORS는 허용 목록", status: 충족, evidence: "CORS 미들웨어 없음 (같은 출처 프록시)"}

