# 예시: 입력 → 표본 검사, 표본 오류는 반려해 재작업 (https://github.com/reddol18/docflow/issues/94)
# 기본 흐름(default.yaml)과 같고, 검사자가 표본 문서를 사유를 적어 반려할 수 있다.
# 반려된 문서는 입력으로 돌아가 작업자가 고쳐 다시 넘기면(문서 단계 화면) 다시 검사한다.
# 표본 오류(반려된 무작위 표본 문서)가 2건 이상이 되면 철 전체를 입력으로 되돌리고 검사 목록은 새로 만든다.
# 그 문서만 재작업하려면 sample_error: document (volume_at은 빼기).
name: 입력 → 표본 검사 (반려 재작업, 표본 오류 2건이면 철 전체)
distinct_actors: true
count_unconfirmed: true
stages:
  - name: entry
    label: 입력
    role: reviewer
    submit: on_index
  - name: inspect
    label: 검사
    role: inspector
    select: sample
    reject: true
    reject_to: entry
    sample_error: volume
    volume_at: 2
