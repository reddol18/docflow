# 합성 양식 agency1990 — 지어낸 도 사업소의 1990년대 시행문 (eval/synth/render.py, https://github.com/reddol18/docflow/issues/139 조건 3).
# 기본 스키마(isad_g.yaml) 칸에 잇는 기관 매핑 (https://github.com/reddol18/docflow/issues/9). 기관·사람·주소는 모두 지어낸 것.
# 김해 꼴과 머리 배치만 다르고(문서번호·시행일자 한 줄, 접수란은 쪽 아래) 4칸·손글씨 칸(일련번호·시행일자)은 같다 →
# 김해와 같은 규칙(app/graph.py RULES)을 쓴다.
name: 합성 도 사업소 시행문 4칸 (1990년대)
base: isad_g.yaml
extract:
  preamble: |-
    입력은 1990년대 도 소속 사업소·연구소 공문서(시행문) 첫 쪽을 OCR로 줄 단위로 옮긴 텍스트다.
    맨 위에 기관 이름, 그 아래 한 줄에 문서번호와 시행일자, 다음 줄에 수신·경유·참조, 그 아래 제목이 온다.
  rules: |-
    OCR 텍스트에는 글자를 잘못 읽은 곳이 많다. 행정 문서 문맥상 명백한 오독은 바른 글자로 고쳐 적는다. 숫자·고유명사는 근거 없이 바꾸지 않는다.
    문서번호와 시행일자가 한 줄에 있으면 '시행일자' 낱말 앞까지가 문서번호다. 제목은 '제목' 항목 줄의 끝까지 빠짐없이 적는다.
    수신은 '수신' 항목의 값만 적고 경유·참조·접수란 글자는 넣지 않는다.
    칸마다 confidence(0~1)를 붙인다. 텍스트에 없는 것을 지어내지 않는다.
fields:
  - name: docno
    label: 문서번호
    level: document
    method: rule
    rule: docno
    isad: reference_code
    flag_key: serial
    prompt: '문서번호 (예: "수관 1420-318"). 기관 약칭 + 분류번호 + "-" + 일련번호'
  - {name: serial, label: 일련번호, level: document, method: hidden, rule: serial, derive_from: docno, isad: reference_code}
  - name: date
    label: 시행일자
    level: document
    method: rule
    rule: date
    isad: dates
    prompt: '시행일자를 YYYY-MM-DD로. 2자리 연도는 1990년대로 풀이. 일부가 없으면 아는 부분만 쓰고 확신도를 낮춘다'
  - name: recipient
    label: 수신
    level: document
    method: rule
    rule: recipient
    isad: scope_content
    note: ISAD(G)에 수신 요소가 없어 범위와 내용(3.3.1)에 잇는다
    prompt: '수신 (기관·사람·상호). "내부결재", "수신처 참조"도 그대로 값이다'
    crop: recipient
  - {name: title, label: 제목, level: document, method: llm_extract, isad: title, prompt: 제목, crop: title}
search:
  keyword: [title, recipient, docno]
  embed: [title, recipient, docno, date]
  year: date
  columns: [date, docno, title, recipient]
